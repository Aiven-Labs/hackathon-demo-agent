name: Starter checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python evaluate.py --split heldout
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Start local stack
        run: |
          export DEMO_PASSWORD=ci-demo-password-long-enough
          export CLICKHOUSE_PASSWORD=ci-clickhouse-password
          docker compose up --build -d
      - name: Verify all signals
        run: python tests/smoke_local.py
      - name: Stop local stack
        if: always()
        run: |
          export DEMO_PASSWORD=ci-demo-password-long-enough
          export CLICKHOUSE_PASSWORD=ci-clickhouse-password
          docker compose down -v
